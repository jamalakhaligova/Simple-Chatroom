<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Chatroom</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; margin: 0; background: #f2f3f5; color: #222; }
  input, button { font: inherit; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; }
  button { background: #3b6fd8; color: #fff; border: none; cursor: pointer; }
  button.secondary { background: #e4e6ea; color: #222; }
  .hidden { display: none !important; }

  #login { max-width: 320px; margin: 15vh auto; background: #fff; padding: 24px; border-radius: 10px;
           display: flex; flex-direction: column; gap: 10px; }
  #login h2 { margin: 0 0 6px; }

  #chat { display: flex; height: 100vh; }
  aside { width: 200px; background: #fff; border-right: 1px solid #ddd; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  aside h3 { margin: 0; font-size: 14px; color: #666; }
  #rooms { list-style: none; margin: 0; padding: 0; flex: 1; overflow-y: auto; }
  #rooms li { padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  #rooms li:hover { background: #f2f3f5; }
  #rooms li.current { background: #3b6fd8; color: #fff; }
  aside form { display: flex; gap: 4px; }
  aside form input { flex: 1; min-width: 0; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #ddd; }
  #log { flex: 1; overflow-y: auto; padding: 16px; white-space: pre-wrap; }
  #log .error { color: #c00; }
  #log .me { color: #3b6fd8; }
  #send { display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-top: 1px solid #ddd; }
  #send input { flex: 1; }

  @media (max-width: 600px) {
    #chat { flex-direction: column; }
    aside { width: auto; border-right: none; border-bottom: 1px solid #ddd; max-height: 35vh; }
  }
</style>
</head>
<body>

<form id="login">
  <h2>Simple Chatroom</h2>
  <input id="username" placeholder="Your name" required>
  <input id="firstRoom" placeholder="Room" required>
  <button>Enter</button>
</form>

<div id="chat" class="hidden">
  <aside>
    <h3>Rooms</h3>
    <ul id="rooms"></ul>
    <form id="newRoom">
      <input id="newRoomName" placeholder="New room" required>
      <button>Go</button>
    </form>
  </aside>
  <main>
    <header>
      <strong id="title"></strong>
      <button class="secondary" id="quit">Quit</button>
    </header>
    <div id="log"></div>
    <form id="send">
      <input id="message" placeholder="Type a message" autocomplete="off" required>
      <button>Send</button>
    </form>
  </main>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  // the server splits commands on spaces, so names can't contain them
  const word = (id) => $(id).value.trim().replace(/\s+/g, "_");
  let ws, buffer, currentRoom, roomTimer;

  function show(text, cls) {
    const line = document.createElement("div");
    line.textContent = text;
    if (cls) line.className = cls;
    $("log").appendChild(line);
    $("log").scrollTop = $("log").scrollHeight;
  }

  function send(line) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(line + "\n");
  }

  function join(room) {
    if (!room || room === currentRoom) return;
    currentRoom = room;
    $("title").textContent = "# " + room;
    $("log").innerHTML = "";
    send("/join " + room);
    send("/rooms");
  }

  function renderRooms(names) {
    if (!names.includes(currentRoom)) names.push(currentRoom);
    $("rooms").innerHTML = "";
    for (const name of names.sort()) {
      const li = document.createElement("li");
      li.textContent = "# " + name;
      if (name === currentRoom) li.className = "current";
      li.onclick = () => join(name);
      $("rooms").appendChild(li);
    }
  }

  function handleLine(line) {
    if (line.startsWith("Error: ")) return show(line, "error");
    line = line.replace(/^>: /, "");
    if (line.startsWith("Available rooms are:")) {
      const names = line.slice("Available rooms are:".length).split(",").map(s => s.trim()).filter(Boolean);
      return renderRooms(names);
    }
    // skip the greeting, the header already shows who you are
    if (line.startsWith("Hi ")) return;
    show(line);
  }

  $("login").onsubmit = (e) => {
    e.preventDefault();
    const name = word("username");
    const room = word("firstRoom");
    buffer = "";
    currentRoom = null;
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");

    ws.onopen = () => {
      $("login").classList.add("hidden");
      $("chat").classList.remove("hidden");
      send("/user " + name);
      join(room);
      // keep the room list fresh so rooms created by others show up
      roomTimer = setInterval(() => send("/rooms"), 5000);
      $("message").focus();
    };

    // TCP data can arrive in arbitrary chunks, so split it into lines ourselves
    ws.onmessage = (e) => {
      buffer += e.data;
      const lines = buffer.split("\n");
      buffer = lines.pop();
      lines.forEach(handleLine);
    };

    ws.onclose = () => {
      clearInterval(roomTimer);
      $("chat").classList.add("hidden");
      $("login").classList.remove("hidden");
    };
  };

  $("send").onsubmit = (e) => {
    e.preventDefault();
    const text = $("message").value.trim();
    if (!text) return;
    send("/msg " + text);
    // the server doesn't echo your own messages back, so show them here
    show("you: " + text, "me");
    $("message").value = "";
  };

  $("newRoom").onsubmit = (e) => {
    e.preventDefault();
    join(word("newRoomName"));
    $("newRoomName").value = "";
  };

  $("quit").onclick = () => send("/quit");
</script>
</body>
</html>
